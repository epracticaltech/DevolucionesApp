spring:
  application:
    name: api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devoluciones}
    username: ${DB_USER:devoluciones}
    password: ${DB_PASSWORD:devoluciones_secret_pass}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:ClaveSecretaSuperSeguraParaDevolucionesApp2026ConMasDe256BitsDeLongitud}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:ClaveSecretaSuperSeguraParaDevolucionesApp2026ConMasDe256BitsDeLongitud}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  carga:
    dir: ${CARGA_DIR:../carga}
    max-filas: ${CARGA_MAX_FILAS:50000}

server:
  port: 8080
